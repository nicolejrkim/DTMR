# Booster K1 release config: warm start, Ndiffuse 8, sigma 0.10, base 1.5, pelvis 168 / relpelvis 84. Gains from the descriptor.
# Reference: pass --motion_path <clip>_50Hz.npz (or set motion_path below); docs: "Reference motions".
# Run:
#   dtmr --config src/dtmr/examples/booster_k1_release_warp.yaml --output_dir output/booster_k1_release
robot: booster_k1
Hnode: 8
Hsample: 40
Ndiffuse: 8
Ndiffuse_init: 5
Nsample: 4096
action_scale: 1.0
auto_joint_range: true
dphi_exp_base: 1.5
dt: 0.02
horizon_diffuse_factor: 0.95
inner_rate_pd: true
joint_range_margin_abs: 0.5
joint_range_margin_ratio: 0.05
joint_range_min_width: 0.05
joint_range_round_to: 0.1
motion_fps: 50
seed: 0
sigma_scale: 0.1
sigma_scale_phi: 0.3
temp_sample: 0.3
timestep: 0.005
traj_diffuse_factor: 0.6
Ndiffuse_steady: 2
Ndiffuse_dyn: 3
dyn_lo: 1.5
dyn_hi: 3.0
elite_frac: 0.1
Ndiffuse_warmup_steps: 25
dyn_entry_floor_exp: 0
dyn_end_exp: 2
Ndiffuse_init_start_exp: -2
Ndiffuse_warmup_start_exp: -2
cost_config:
  cost_link_scale:
    aahead_pitch_link: 16
    trunk: 16
  w_action_rate: 1.0
  w_com: 0.0
  w_dphi: 5.0
  w_dphi_accel: 0.0
  w_energy: 0.05
  w_foot_slip: 0.0
  w_joint_jerk: 0.0
  w_joint_vel: 0.01
  w_orient_offset: 0.0
  w_orient_pure: 5.0
  w_pelvis: 168.0
  w_pos_relcom: 0.0
  w_pos_relpelvis: 84.0
  w_joint_vel_ref: 0.01
motion_path: ./data/REPLACE_ME/REPLACE_ME_50Hz.npz
n_steps: 800
